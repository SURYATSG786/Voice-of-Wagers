<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1b1f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD60A"/>
      <stop offset="0.5" stop-color="#00F5D4"/>
      <stop offset="1" stop-color="#9B5DE5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect x="0" y="300" width="1200" height="6" fill="url(#accent)"/>
  <!-- sound wave -->
  <g fill="#FFD60A" opacity="0.85">
    <rect x="90" y="118" width="10" height="44" rx="5"><animate attributeName="height" values="44;90;44" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="118;95;118" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="112" y="100" width="10" height="80" rx="5"><animate attributeName="height" values="80;30;80" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="100;125;100" dur="1.0s" repeatCount="indefinite"/></rect>
    <rect x="134" y="90" width="10" height="100" rx="5"><animate attributeName="height" values="100;50;100" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="90;115;90" dur="1.4s" repeatCount="indefinite"/></rect>
    <rect x="156" y="104" width="10" height="72" rx="5"><animate attributeName="height" values="72;110;72" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="104;85;104" dur="0.9s" repeatCount="indefinite"/></rect>
    <rect x="178" y="118" width="10" height="44" rx="5"><animate attributeName="height" values="44;80;44" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="118;100;118" dur="1.3s" repeatCount="indefinite"/></rect>
  </g>
  <text x="240" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#accent)">Voice of Wagers</text>
  <text x="244" y="195" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#e6edf3">Your work. Your worth. Your next step.</text>
  <text x="244" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">A multilingual companion for migrant construction workers  |  11 languages  |  Voice-enabled</text>
</svg>
