name: App checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Prepare local neural speech dependencies
        run: |
          python3 -m venv .speech-env
          .speech-env/bin/python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          npm run setup:speech
      - run: npm test
      - run: npm run eval
      - run: npm run build
